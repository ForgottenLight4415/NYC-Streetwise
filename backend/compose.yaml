name: nyc-streetwise-backend

services:
  backend:
    build: .
    image: nyc-streetwise-backend:latest
    # Node handles SIGTERM itself (src/index.js), but init gives it a proper
    # PID 1 to reap under.
    init: true
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Passes SOCRATA_APP_TOKEN / MONGODB_URI / GEMINI_API_KEY through from the
    # gitignored .env without committing them.
    env_file:
      - path: .env
        required: true
    # Explicit environment wins over env_file. These are the values that are
    # wrong inside a container.
    environment:
      PORT: "3001"
      # This is the DEV database: the `mongo` service below. .env says
      # 127.0.0.1, which inside the container is the container.
      #
      # Prod is Atlas and does not come through compose at all — the deploy host
      # supplies its own MONGODB_URI (see .env.production.example). If you ever
      # do want a container pointed at Atlas, override at the command line
      # (`MONGODB_URI=mongodb+srv://… docker compose up`) rather than editing
      # this line, so the dev default stays the safe one.
      MONGODB_URI: ${MONGODB_URI_OVERRIDE:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-nyc-streetwise-dev}
      # No Ollama container by design. If `ollama serve` is running on the
      # host this reaches it; if it is not, explain.js catches the connection
      # refusal and serves deterministic template text. Set AI_PROVIDER=gemini
      # in .env to use the hosted model instead.
      OLLAMA_ENDPOINT: http://host.docker.internal:11434/api/generate
    extra_hosts:
      # No-op on Docker Desktop, required on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  # The dev database. Prod is Atlas; nothing here is deployed.
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      # Loopback only — published so the API can also run natively on the host
      # (npm run dev) against this same container, and so Compass can attach.
      # Never bind 0.0.0.0: this mongod has no authentication.
      # Collides with a Homebrew mongod on 27017? Use "127.0.0.1:27018:27017"
      # and set MONGODB_URI=mongodb://127.0.0.1:27018 in .env.
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
